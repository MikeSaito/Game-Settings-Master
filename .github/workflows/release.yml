name: Release app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Build a signed test installer without changing tags or publishing a release"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  native-desktop:
    uses: ./.github/workflows/windows-e2e.yml
    with:
      test_updates: true
  build-windows:
    needs: native-desktop
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
            $version = $pkg.version
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          if (-not [bool]::Parse("${{ inputs.validation_only || false }}") -and $version.Contains('-')) {
            throw "Prerelease builds require validation_only; stable publication is disabled for this version"
          }

      - name: Verify version and immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
          GSM_VALIDATION_ONLY: ${{ inputs.validation_only || false }}
        run: node scripts/release-preflight.mjs

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = "${{ env.VERSION }}"

          $setups = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*_${version}_x64-setup.exe" -File)
          if ($setups.Count -ne 1) { throw "Expected exactly one NSIS installer for $version" }
          $setup = $setups[0]
          $sig = Get-Item -LiteralPath ($setup.FullName + '.sig') -ErrorAction Stop

          $setupName = "Game-Settings-Master_${version}_x64-setup.exe"
          Copy-Item $setup.FullName $setupName
          Copy-Item $sig.FullName "$setupName.sig"

          $signature = (Get-Content $sig.FullName -Raw).Trim()
          $tag = "v$version"
          $repo = "${{ github.repository }}"
          $downloadUrl = "https://github.com/$repo/releases/download/$tag/$setupName"
          $releaseNotes = if (Test-Path "docs/release-v$version.md") {
            Get-Content "docs/release-v$version.md" -Raw
          } else {
            ""
          }

          $latest = [ordered]@{
            version   = $version
            notes     = $releaseNotes
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url       = $downloadUrl
                signature = $signature
              }
            }
          }

          $latestJson = $latest | ConvertTo-Json -Depth 5
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$PWD\latest.json", $latestJson + "`n", $utf8NoBom)

          "SETUP_NAME=$setupName" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Prepare release notes
        if: '!inputs.validation_only'
        shell: pwsh
        run: |
          $version = "${{ env.VERSION }}"
          $setupName = "${{ env.SETUP_NAME }}"
          $notesPath = "docs/release-v$version.md"
          if (Test-Path $notesPath) {
            $body = Get-Content $notesPath -Raw
          } else {
            $body = @"
          Game Settings Master v$version
          Windows · бесплатно · без подписи издателя

          Установщик: $setupName

          Обновление внутри приложения: при запуске GSM сам проверит latest.json на GitHub Releases.

          При первом запуске SmartScreen: Подробнее → Выполнить в любом случае.

          Сайт: https://gsm-tool.com/
          "@
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$PWD/release-notes.md", $body.Trim(), $utf8NoBom)

      - name: Verify final installer signature and manifest
        shell: pwsh
        run: |
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify_release -- "${{ env.SETUP_NAME }}" "${{ env.SETUP_NAME }}.sig" latest.json "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed" }
          ./scripts/test-installer.ps1 -Installer "${{ env.SETUP_NAME }}"

      - name: Create immutable release draft
        if: '!inputs.validation_only'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          node scripts/release-preflight.mjs --create-tag
          if ($LASTEXITCODE -ne 0) { throw "Release identity check failed" }
          gh release create "v${{ env.VERSION }}" --repo "${{ github.repository }}" --verify-tag --draft --title "Game Settings Master v${{ env.VERSION }}" --notes-file release-notes.md "${{ env.SETUP_NAME }}" "${{ env.SETUP_NAME }}.sig" latest.json
          if ($LASTEXITCODE -ne 0) { throw "Draft creation failed; existing releases must not be replaced" }

      - name: Verify uploaded assets and publish
        if: '!inputs.validation_only'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download "v${{ env.VERSION }}" --repo "${{ github.repository }}" --dir verified-release
          if ($LASTEXITCODE -ne 0) { throw "Release download failed" }
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example verify_release -- "verified-release/${{ env.SETUP_NAME }}" "verified-release/${{ env.SETUP_NAME }}.sig" verified-release/latest.json "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Uploaded asset verification failed" }
          gh release edit "v${{ env.VERSION }}" --repo "${{ github.repository }}" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Publication failed" }

      - name: Save signed validation installer
        if: inputs.validation_only
        uses: actions/upload-artifact@v7
        with:
          name: ue-validation-${{ env.VERSION }}-${{ github.run_id }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 30
