name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "SECURITY.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "SECURITY.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Verify TypeScript bindings in sync
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/verify-types-sync.ps1

      - name: Verify validation index in sync
        run: npm run validation:index:check

      - name: Verify i18n key parity
        run: npm run i18n:parity

      - name: Rust release compile check
        working-directory: src-tauri
        run: cargo check --release

      - name: Frontend build
        run: npm run build

      - name: Frontend unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: E2E tests
        run: npm run e2e

      - name: Catalog builder tests
        run: npm run catalog:test

      - name: Tauri bundle smoke (no installer)
        run: npx tauri build --no-bundle

  landing-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "Failed to read package.json version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install & build landing
        working-directory: landing
        env:
          VITE_BASE_PATH: /
          VITE_SITE_URL: https://gsm-tool.com
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.version }}
          VITE_YANDEX_METRIKA_ID: "110097894"
        run: |
          npm ci
          npm run build
