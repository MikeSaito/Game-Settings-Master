name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "SECURITY.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "SECURITY.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Verify generated files and package alignment
        run: |
          npm run validation:index:check
          npm run i18n:parity
          npm run tauri:versions:check

      - name: Build and test frontend
        run: |
          npm run build
          npm test

      - name: Catalog builder tests
        run: npm run catalog:test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e

  rust-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' }}

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.event_name == 'push' }}

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Verify TypeScript bindings in sync
        shell: pwsh
        run: ./scripts/verify-types-sync.ps1

  tauri-smoke:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-release

      - run: npm ci

      - name: Tauri bundle smoke
        run: npx tauri build --no-bundle

  landing-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "Failed to read package.json version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install and build landing
        working-directory: landing
        env:
          VITE_BASE_PATH: /
          VITE_SITE_URL: https://gsm-tool.com
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_VERSION: ${{ steps.app_version.outputs.version }}
          VITE_YANDEX_METRIKA_ID: "110097894"
        run: |
          npm ci
          npm run build
