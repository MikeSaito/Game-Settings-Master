<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Settings Master</title>
    <link rel="stylesheet" href="/src/styles/startup.css" />
  </head>
  <body>
    <div id="root">
      <main class="startup-screen" aria-live="polite" role="status">
        <div class="startup-card">
          <img
            class="startup-logo"
            src="/logo.svg"
            width="72"
            height="72"
            alt=""
          />
          <h1 class="startup-title">Game Settings Master</h1>
          <p class="startup-label" data-boot-label>Preparing the app</p>
          <p class="startup-description" data-boot-description>
            Your game library and settings will appear shortly.
          </p>
          <div
            class="startup-progress startup-progress--indeterminate"
            aria-hidden="true"
          >
            <span></span>
          </div>
          <a class="startup-retry" href="/" data-boot-retry hidden
            >Reload the interface</a
          >
        </div>
      </main>
    </div>
    <script src="/startup.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
